name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Verify generated client
      run: python tools/generate.py --check
    - name: Build
      run: dotnet build --configuration Release ./src
    - name: Test
      run: dotnet test --configuration Release ./src
  framework:
    name: Verify .NET Framework consumer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify .NET Framework consumer
        run: dotnet run --project tools/FrameworkSmoke --configuration Release
